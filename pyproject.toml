[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-schematic"
version = "0.1.0"
description = "Визуальный конструктор стоек и кабельных трасс для NetBox"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "David Kad" }]
keywords = ["netbox", "netbox-plugin", "dcim", "ipam", "cabling"]
classifiers = [
    "Framework :: Django",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/TSDavid135/netbox-schematic"
Repository = "https://github.com/TSDavid135/netbox-schematic"

[tool.setuptools.packages.find]
include = ["netbox_schematic*"]

[tool.setuptools.package-data]
netbox_schematic = ["templates/**/*.html"]
