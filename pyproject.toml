[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-schematic"
version = "0.69.6"
description = "A visual builder for racks, cable routes, power and IP space in NetBox"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["openpyxl"]   # Excel parsing for the import (Patchen/Unpatchen)
license = { text = "MIT" }
authors = [{ name = "David Kad" }]
keywords = ["netbox", "netbox-plugin", "dcim", "ipam", "cabling"]
classifiers = [
    "Framework :: Django",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/TSDavid135/netbox-schematic"
Repository = "https://github.com/TSDavid135/netbox-schematic"

[tool.setuptools.packages.find]
include = ["netbox_schematic*"]

[tool.setuptools.package-data]
# Static files (css/js) MUST ship in the package, otherwise a wheel/git
# (non-editable) install won't deliver the plugin frontend to the server.
netbox_schematic = ["templates/**/*.html", "static/**/*", "forms/templates/*.xlsx"]
